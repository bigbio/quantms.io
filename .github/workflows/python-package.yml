# This workflow installs dependencies with uv and runs the unit tests on Python 3.11 and the
# integration tests on 3.10 and 3.11. Lint and the 3.10 unit tests run in python-app.yml.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check that core dependencies import qpx.mudata
        run: |
          uv sync
          uv run --no-sync python -c "import anndata, mudata, scipy; import qpx.mudata"
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Test with pytest (Unit Tests Only)
        run: uv run pytest -vv -n auto -m "not integration and not large_data"

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests # Only run if unit tests pass
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Test with pytest (Integration Tests)
        run: uv run pytest -vv -n auto -m "integration" --timeout=3000
        env:
          PYTHONIOENCODING: utf-8
