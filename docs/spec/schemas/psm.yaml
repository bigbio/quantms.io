name: psm
file_type: psm_file
primary_key: [psm_id]
identity_composite: [peptidoform, charge, run_file_name, scan]
doc: "Peptide Spectrum Matches from identification searches"

fields:
  # Identity
  psm_id:
    type: int64
    required: true
    nullable: false
    doc: "Opaque identity of the psm (int64), supplied by the producer or derived from the identity_composite declared in the footer; the primary key of this view."

  # Core identification (shared with Feature)
  sequence:
    type: string
    required: true
    doc: "Unmodified peptide sequence"
  peptidoform:
    type: string
    required: true
    doc: "ProForma notation"
  modifications:
    type: "list<modification>"
    doc: "Structured modifications"
  # Competing modification interpretations (optional)
  modification_candidates:
    type: "list<modification_candidate>"
    optional: true
    nullable: true
    doc: "Every modification the evidence considers at each position, the one the peptidoform places (assigned) and the ones it competes with, each with its probability given this identification. A position can hold several candidates (acetyl or trimethyl on one Lys, or a substitution); one modification can have several candidate positions (localization). Null when the producer reports no alternatives; modifications keeps what the peptidoform says."
  charge:
    type: int16
    required: true
    doc: "Precursor charge"
  posterior_error_probability:
    type: float64
    doc: "PEP - probability PSM is incorrect (lower is better)"
  is_decoy:
    type: bool
    required: true
    doc: "Decoy match flag; false when the identification did not use a target-decoy database search"
  calculated_mz:
    type: float32
    required: true
    nullable: true
    doc: "Theoretical m/z; null when it cannot be calculated from the reported peptidoform"
  observed_mz:
    type: float32
    required: true
    doc: "Experimental m/z"
  mass_error_ppm:
    type: float32
    doc: "Mass error in ppm: 1e6 * (observed_mz - calculated_mz) / calculated_mz"
  additional_scores:
    type: "list<score>"
    doc: "Search engine scores"
  predicted_rt:
    type: float32
    doc: "Predicted RT (seconds)"
  run_file_name:
    type: string
    required: true
    doc: "Run file containing this PSM"
  cv_params:
    type: "list<cv_param>"
    doc: "CV parameters"
  scan:
    type: "list<int32>"
    required: true
    doc: "Scan ID (array of int components)"
  rt:
    type: float32
    doc: "Retention time (seconds)"
  ion_mobility:
    type: float32
    doc: "Ion mobility"
  missed_cleavages:
    type: int16
    doc: "Number of missed enzymatic cleavages (MS:1003044)"

  # PSM-specific fields
  protein_accessions:
    type: "list<string>"
    doc: "Protein accessions the peptide maps to"

  # Cross-linking (XL-MS)
  cross_links:
    type: "list<cross_link>"
    doc: "Cross-link information for XL-MS experiments"

  # Spectral data (optional - may be stored in mz.parquet instead)
  mz_array:
    type: "list<float32>"
    doc: "Spectrum m/z values"
  intensity_array:
    type: "list<float32>"
    doc: "Spectrum intensity values"
  charge_array:
    type: "list<int32>"
    doc: "Fragment charge values"
  ion_type_array:
    type: "list<string>"
    doc: "Fragment ion type annotations (e.g., b1, y2, a2)"
  ion_mobility_array:
    type: "list<float32>"
    doc: "Fragment ion mobility values"

  # Optional cross-reference
  feature_id:
    type: int64
    optional: true
    nullable: true
    doc: "Optional reference to the feature this PSM maps to (feature.feature_id); null when unlinked."
